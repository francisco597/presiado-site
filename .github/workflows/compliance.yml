name: Cumplimiento del sitio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar afirmaciones prohibidas
        run: python3 .github/compliance/check_compliance.py .
